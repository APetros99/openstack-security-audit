[metadata]
name = openstack-security-audit
version = 1.0.0
summary = Security event collector and report generator for OpenStack
author = Alfonso Petrosino
license = Apache-2.0

[options]
packages = find:
python_requires = >=3.10
install_requires =
    openstacksdk>=1.5.0

[options.entry_points]
console_scripts =
    openstack-security-audit = security_audit.cli:main

[options.packages.find]
exclude =
    tests

[flake8]
max-line-length = 88
extend-ignore = E203,W503
